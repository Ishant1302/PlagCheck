<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="PlagCheck — Intelligent plagiarism detection with multi-metric NLP analysis."/>
  <title>PlagCheck — Intelligent Plagiarism Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

  <script>
    // Surface any silent errors immediately
    window.onerror = function(msg, src, line, col, err) {
      document.getElementById('root').innerHTML =
        '<div style="color:#ef4444;padding:40px;font-family:sans-serif;background:#080b12;min-height:100vh">' +
        '<h2>⚠ Script Error</h2><pre style="margin-top:12px;font-size:13px;white-space:pre-wrap">' +
        msg + '\n' + src + ':' + line + '\n' + (err && err.stack ? err.stack : '') + '</pre></div>';
    };
  </script>
  <style>
    :root{
      --bg:#080b12;--bg-card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);
      --border-f:rgba(99,102,241,0.6);--a1:#6366f1;--a2:#8b5cf6;--a3:#a78bfa;
      --green:#22c55e;--amber:#f59e0b;--red:#ef4444;
      --green-d:rgba(34,197,94,0.15);--amber-d:rgba(245,158,11,0.15);--red-d:rgba(239,68,68,0.15);
      --t1:#f0f4ff;--t2:#94a3b8;--tm:#475569;
      --r-md:14px;--r-lg:20px;--shadow:0 4px 24px rgba(0,0,0,0.4);
      --glow:0 0 40px rgba(99,102,241,0.12);--tr:0.2s ease;
      --fs:Inter,system-ui,sans-serif;--fm:'JetBrains Mono',monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:var(--fs);background:var(--bg);color:var(--t1);
      min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%,rgba(99,102,241,.08) 0%,transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%,rgba(139,92,246,.06) 0%,transparent 60%);
    }
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px}
    .wrap{max-width:1300px;margin:0 auto;padding:0 24px 80px}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);transition:border-color var(--tr),box-shadow var(--tr)}
    .card:hover{border-color:rgba(255,255,255,.12);box-shadow:var(--shadow),var(--glow)}
    .grad{background:linear-gradient(135deg,var(--a1),var(--a3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    /* Buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 40px;font-family:var(--fs);font-size:1rem;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));border:none;border-radius:var(--r-md);cursor:pointer;transition:transform var(--tr),box-shadow var(--tr);box-shadow:0 4px 20px rgba(99,102,241,.35)}
    .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 32px rgba(99,102,241,.5)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-g{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-size:.8rem;font-weight:500;color:var(--t2);background:transparent;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all var(--tr);font-family:var(--fs)}
    .btn-g:hover{border-color:rgba(255,255,255,.2);color:var(--t1);background:var(--bg-card)}
    /* Header */
    .hdr{padding:40px 0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);margin-bottom:40px}
    .hdr-brand{display:flex;align-items:center;gap:14px}
    .hdr-logo{width:44px;height:44px;background:linear-gradient(135deg,var(--a1),var(--a2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 4px 20px rgba(99,102,241,.4)}
    .hdr-pill{padding:5px 12px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.25);border-radius:99px;font-size:.72rem;font-weight:600;color:var(--a3);text-transform:uppercase;letter-spacing:.5px}
    /* Inputs */
    .in-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
    @media(max-width:768px){.in-grid{grid-template-columns:1fr}}
    .in-card{padding:24px}
    .in-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .in-lbl{font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:8px}
    .doc-b{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:.7rem;font-weight:700;background:rgba(99,102,241,.15);color:var(--a3)}
    .in-acts{display:flex;gap:8px}
    textarea{width:100%;min-height:220px;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:var(--r-md);color:var(--t1);font-family:var(--fm);font-size:.85rem;line-height:1.7;padding:16px;resize:vertical;transition:border-color var(--tr),box-shadow var(--tr);outline:none}
    textarea::placeholder{color:var(--tm)}
    textarea:focus{border-color:var(--border-f);box-shadow:0 0 0 3px rgba(99,102,241,.08)}
    .in-meta{display:flex;gap:16px;margin-top:10px;font-size:.75rem;color:var(--tm)}
    /* Analyze row */
    .an-row{display:flex;justify-content:center;margin-bottom:40px}
    /* Error */
    .err{padding:16px 20px;background:var(--red-d);border:1px solid rgba(239,68,68,.3);border-radius:var(--r-md);color:var(--red);font-size:.875rem;display:flex;align-items:center;gap:10px;margin-bottom:28px}
    /* Spinner */
    .spin-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px;gap:20px}
    .spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--a1);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* Results */
    .results{display:flex;flex-direction:column;gap:24px}
    /* Score Hero */
    .hero{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;padding:36px}
    @media(max-width:600px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
    .hero-info{display:flex;flex-direction:column;gap:12px}
    .hero-lbl{font-size:.8rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--tm)}
    .hero-val{font-size:clamp(2.5rem,6vw,4rem);font-weight:800;line-height:1;letter-spacing:-2px}
    .hero-desc{font-size:.9rem;color:var(--t2);max-width:380px;line-height:1.6}
    /* Ring */
    .ring-wrap{position:relative;width:160px;height:160px;flex-shrink:0}
    .ring-wrap svg{transform:rotate(-90deg)}
    .ring-ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
    .ring-pct{font-size:1.8rem;font-weight:800;line-height:1}
    .ring-sub{font-size:.65rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--tm)}
    /* Verdict */
    .vb{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:99px;font-size:.85rem;font-weight:700;border:1px solid;width:fit-content}
    .vb-l{background:var(--green-d);border-color:rgba(34,197,94,.3);color:var(--green)}
    .vb-m{background:var(--amber-d);border-color:rgba(245,158,11,.3);color:var(--amber)}
    .vb-h{background:var(--red-d);border-color:rgba(239,68,68,.3);color:var(--red)}
    .pdot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;animation:pulse 2s ease infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
    /* Metrics */
    .mtr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
    .mtr-card{padding:22px 24px}
    .mtr-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
    .mtr-name{font-size:.8rem;font-weight:600;color:var(--t2)}
    .mtr-wt{font-size:.7rem;color:var(--tm);margin-top:2px}
    .mtr-val{font-size:1.5rem;font-weight:800}
    .bar-t{width:100%;height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin-top:12px}
    .bar-f{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.4,0,.2,1)}
    .mtr-desc{font-size:.72rem;color:var(--tm);margin-top:6px;line-height:1.5}
    /* Charts row */
    .chr-row{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
    @media(max-width:900px){.chr-row{grid-template-columns:1fr}}
    .chr-card{padding:28px}
    .chr-ttl{font-size:.8rem;font-weight:600;color:var(--t2);margin-bottom:20px;text-transform:uppercase;letter-spacing:.7px}
    /* Doc Stats */
    .ds-card{padding:20px 24px}
    .ds-hdg{font-size:.75rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--tm);margin-bottom:14px;display:flex;align-items:center;gap:6px}
    .st-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
    .st-row:last-child{border-bottom:none}
    .st-lbl{font-size:.82rem;color:var(--t2)}
    .st-val{font-size:.82rem;font-weight:700;font-family:var(--fm);color:var(--t1)}
    /* Matched Sentences */
    .ms-card{padding:28px}
    .ms-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .ms-ttl{font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--t2)}
    .ms-cnt{padding:4px 12px;background:var(--red-d);border:1px solid rgba(239,68,68,.25);border-radius:99px;font-size:.75rem;font-weight:700;color:var(--red)}
    .mi{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:14px;transition:border-color var(--tr)}
    .mi:hover{border-color:rgba(239,68,68,.3)}
    .mi:last-child{margin-bottom:0}
    .mi-bar{height:3px}
    .mi-body{display:grid;grid-template-columns:1fr 1fr}
    @media(max-width:700px){.mi-body{grid-template-columns:1fr}}
    .mi-col{padding:16px 18px}
    .mi-col:first-child{border-right:1px solid var(--border)}
    .mi-lbl{font-size:.68rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tm);margin-bottom:8px}
    .mi-txt{font-size:.85rem;line-height:1.6;color:var(--t2)}
    .mi-ft{padding:10px 18px;background:rgba(0,0,0,.15);display:flex;align-items:center;justify-content:flex-end;gap:6px;border-top:1px solid var(--border)}
    /* Section header */
    .sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:20px}
    .sec-ttl{font-size:1rem;font-weight:700;white-space:nowrap}
    .sec-line{flex:1;height:1px;background:var(--border)}
    /* Empty */
    .empty{text-align:center;padding:80px 40px;color:var(--tm)}
    .empty-ico{font-size:3.5rem;margin-bottom:16px;opacity:.5;display:block}
    .empty-ttl{font-size:1.25rem;font-weight:700;color:var(--t2);margin-bottom:8px}
    .empty-dsc{font-size:.9rem;max-width:380px;margin:0 auto;line-height:1.7}
    /* Animations */
    .fade-in{animation:fadeIn .4s ease both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    /* Custom recharts tooltip */
    .rc-tip{background:#1a1f2e;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 14px;font-family:var(--fs);font-size:.8rem}
  </style>
</head>
<body>
<div id="root"></div>
<script>
// ─── Helpers ──────────────────────────────────────────────────────────
const e = React.createElement;
const {useState, useEffect} = React;
const CIRCUM = 2 * Math.PI * 68;

const METRICS = [
  {k:'tfidf',         lb:'TF-IDF Cosine', dsc:'Content & topic similarity via term weighting',    wt:'35%', c:'#6366f1'},
  {k:'jaccard',       lb:'Jaccard Index',  dsc:'Vocabulary overlap between both texts',            wt:'20%', c:'#8b5cf6'},
  {k:'bigram',        lb:'Bigram Match',   dsc:'Phrase-level paraphrase detection (2-word)',       wt:'20%', c:'#a78bfa'},
  {k:'trigram',       lb:'Trigram Match',  dsc:'Longer phrase detection (3-word sequences)',       wt:'10%', c:'#c4b5fd'},
  {k:'sentence_level',lb:'Sentence Match', dsc:'Direct sentence-by-sentence copy detection',      wt:'15%', c:'#7c3aed'},
];

const STATS = [
  {k:'word_count',          lb:'Total Words',       ico:'📝'},
  {k:'unique_words',        lb:'Unique Words',       ico:'✨'},
  {k:'sentence_count',      lb:'Sentences',          ico:'📄'},
  {k:'avg_sentence_length', lb:'Avg Sentence Length',ico:'📏', sfx:' words'},
  {k:'content_words',       lb:'Content Words',      ico:'🔤'},
];

function vColor(v){ return v==='High'?'var(--red)':v==='Moderate'?'var(--amber)':'var(--green)'; }
function barGrad(s){ return s>=70?'linear-gradient(90deg,#ef4444,#f97316)':s>=35?'linear-gradient(90deg,#f59e0b,#eab308)':'linear-gradient(90deg,#22c55e,#16a34a)'; }
function wc(t){ return t.trim() ? t.trim().split(/\s+/).length : 0; }
function vDesc(v,s){
  if(v==='High') return `A ${s}% score indicates a high likelihood of plagiarism. The submitted text closely mirrors the original.`;
  if(v==='Moderate') return `A ${s}% score suggests moderate overlap. Some content may be paraphrased. Review matched sentences below.`;
  return `A ${s}% score — the texts appear largely original and distinct from each other.`;
}

// ─── SVG Icons ────────────────────────────────────────────────────────
function IconSearch(){ return e('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round'},e('circle',{cx:11,cy:11,r:8}),e('path',{d:'m21 21-4.35-4.35'})); }
function IconReset(){ return e('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round'},e('polyline',{points:'1 4 1 10 7 10'}),e('path',{d:'M3.51 15a9 9 0 1 0 .49-3.7'})); }
function IconWave(c){ return e('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:c,strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round'},e('polyline',{points:'22 12 18 12 15 21 9 3 6 12 2 12'})); }
function IconClipboard(){ return e('svg',{width:12,height:12,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round'},e('path',{d:'M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2'}),e('rect',{x:8,y:2,width:8,height:4,rx:1})); }
function IconX(){ return e('svg',{width:12,height:12,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round'},e('line',{x1:18,y1:6,x2:6,y2:18}),e('line',{x1:6,y1:6,x2:18,y2:18})); }

// ─── Score Ring ────────────────────────────────────────────────────────
function ScoreRing({score, verdict}){
  const [anim, setAnim] = useState(0);
  const color = vColor(verdict);
  useEffect(() => { const t = setTimeout(() => setAnim(score), 100); return () => clearTimeout(t); }, [score]);
  const offset = CIRCUM - (anim / 100) * CIRCUM;
  return e('div', {className:'ring-wrap'},
    e('svg', {width:160, height:160, viewBox:'0 0 160 160'},
      e('circle', {cx:80, cy:80, r:68, fill:'none', stroke:'rgba(255,255,255,0.06)', strokeWidth:10}),
      e('circle', {cx:80, cy:80, r:68, fill:'none', stroke:color, strokeWidth:10,
        strokeLinecap:'round', strokeDasharray:CIRCUM, strokeDashoffset:offset,
        style:{transition:'stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1)', filter:`drop-shadow(0 0 8px ${color}80)`}})
    ),
    e('div', {className:'ring-ctr'},
      e('span', {className:'ring-pct', style:{color}},
        Math.round(anim),
        e('span', {style:{fontSize:'1rem', fontWeight:600, marginLeft:1}}, '%')
      ),
      e('span', {className:'ring-sub'}, 'Similarity')
    )
  );
}

// ─── Verdict Badge ─────────────────────────────────────────────────────
function VerdictBadge({verdict}){
  const cls = verdict==='High'?'vb vb-h':verdict==='Moderate'?'vb vb-m':'vb vb-l';
  const icon = verdict==='High'?'✕':verdict==='Moderate'?'⚠':'✓';
  const label = verdict==='High'?'High Plagiarism':verdict==='Moderate'?'Moderate Similarity':'Low Plagiarism';
  return e('span', {className:cls},
    e('span', {className:'pdot'}),
    e('span', {style:{marginLeft:2, fontSize:'0.9rem'}}, icon),
    label
  );
}

// ─── Metric Card ───────────────────────────────────────────────────────
function MetricCard({lb, dsc, wt, score, c}){
  const [anim, setAnim] = useState(0);
  useEffect(() => { const t = setTimeout(() => setAnim(score), 150); return () => clearTimeout(t); }, [score]);
  return e('div', {className:'card mtr-card'},
    e('div', {className:'mtr-hdr'},
      e('div', null,
        e('p', {className:'mtr-name'}, lb),
        e('p', {className:'mtr-wt'}, 'Weight: ', wt)
      ),
      e('div', {style:{width:36,height:36,borderRadius:10,background:`${c}20`,border:`1px solid ${c}40`,display:'flex',alignItems:'center',justifyContent:'center'}},
        IconWave(c)
      )
    ),
    e('p', {className:'mtr-val', style:{color:c}},
      score.toFixed(1),
      e('span', {style:{fontSize:'0.9rem',fontWeight:500,marginLeft:2}}, '%')
    ),
    e('p', {className:'mtr-desc'}, dsc),
    e('div', {className:'bar-t'},
      e('div', {className:'bar-f', style:{width:`${anim}%`, background:barGrad(score)}})
    )
  );
}

function CustomTip(props) {
  var active = props.active, payload = props.payload;
  if (!active || !payload || !payload.length) return null;
  return e('div', {className:'rc-tip'},
    e('p', {style:{color:'var(--t2)'}}, payload[0].payload.metric),
    e('p', {style:{color:'#a78bfa',fontWeight:700,fontFamily:'var(--fm)'}}, payload[0].value.toFixed(1)+'%')
  );
}

// ─── Pure SVG Radar Chart ──────────────────────────────────────────────
function SvgRadar(props) {
  var data = props.data;
  var SZ = 264, cx = 132, cy = 132, RM = 100, n = data.length;
  if (!n) return null;
  function pt(i, r) {
    var a = (Math.PI * 2 * i / n) - Math.PI / 2;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }
  var rings = [0.25,0.5,0.75,1].map(function(f) {
    return e('polygon',{key:'r'+f,points:data.map(function(_,i){return pt(i,RM*f).join(',');}).join(' '),fill:'none',stroke:'rgba(255,255,255,0.06)',strokeWidth:1});
  });
  var spokes = data.map(function(_,i) { var p=pt(i,RM); return e('line',{key:'sp'+i,x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:'rgba(255,255,255,0.05)',strokeWidth:1}); });
  var dataPts = data.map(function(d,i){return pt(i,RM*(d.value/100)).join(',');}).join(' ');
  var dots = data.map(function(d,i){var p=pt(i,RM*(d.value/100));return e('circle',{key:'dt'+i,cx:p[0],cy:p[1],r:4,fill:'#8b5cf6'});});
  var lbls = data.map(function(d,i){var p=pt(i,RM+24);return e('text',{key:'l'+i,x:p[0],y:p[1],textAnchor:'middle',dominantBaseline:'middle',fontSize:10,fontWeight:600,fill:'#64748b',fontFamily:'Inter,sans-serif'},d.metric);});
  return e('svg',{width:'100%',viewBox:'0 0 '+SZ+' '+SZ,style:{overflow:'visible'}},
    e('g',null,...rings),e('g',null,...spokes),
    e('polygon',{points:dataPts,fill:'rgba(99,102,241,0.18)',stroke:'#6366f1',strokeWidth:2,strokeLinejoin:'round'}),
    e('g',null,...dots),e('g',null,...lbls)
  );
}

function RadarPanel(props) {
  return e('div',{className:'card chr-card'},
    e('p',{className:'chr-ttl'},'Metric Radar'),
    e(SvgRadar,{data:props.data})
  );
}


// ─── Doc Stats ─────────────────────────────────────────────────────────
function StatPanel(props) {
  var title = props.title, stats = props.stats;
  return e('div', {className:'card ds-card'},
    e('p', {className:'ds-hdg'}, '📄 ', title),
    STATS.map(function(item) {
      return e('div', {className:'st-row', key:item.k},
        e('span', {className:'st-lbl'}, item.ico, ' ', item.lb),
        e('span', {className:'st-val'}, (stats && stats[item.k] !== undefined) ? (Number(stats[item.k])).toLocaleString() + (item.sfx||'') : '—')
      );
    })
  );
}

function DocStats(props) {
  var stats = props.stats;
  return e('div', {style:{display:'flex',flexDirection:'column',gap:16}},
    e('p', {className:'chr-ttl', style:{padding:'0 4px',margin:0}}, 'Document Statistics'),
    e(StatPanel, {title:'Document A — Original', stats: stats && stats.doc1}),
    e(StatPanel, {title:'Document B — Submitted', stats: stats && stats.doc2})
  );
}

// ─── Matched Sentences ─────────────────────────────────────────────────
function MatchItem({match, idx}){
  const s = match.score;
  const col = s>=90?'var(--red)':'var(--amber)';
  const bg = s>=90?'linear-gradient(90deg,#ef4444,#f97316)':'linear-gradient(90deg,#f59e0b,#eab308)';
  return e('div', {className:'mi fade-in', style:{animationDelay:`${idx*0.06}s`}},
    e('div', {className:'mi-bar', style:{width:`${s}%`, background:bg}}),
    e('div', {className:'mi-body'},
      e('div', {className:'mi-col'},
        e('p', {className:'mi-lbl'}, 'Original (Doc A)'),
        e('p', {className:'mi-txt'}, `"${match.original}"`)
      ),
      e('div', {className:'mi-col'},
        e('p', {className:'mi-lbl'}, 'Submitted (Doc B)'),
        e('p', {className:'mi-txt'}, `"${match.submitted}"`)
      )
    ),
    e('div', {className:'mi-ft'},
      e('span', {style:{fontSize:'.72rem',color:'var(--tm)'}}, 'Similarity'),
      e('span', {style:{fontSize:'.8rem',fontWeight:700,fontFamily:'var(--fm)',color:col}}, s+'%')
    )
  );
}

function MatchedSents({matches}){
  const has = matches && matches.length > 0;
  return e('div', {className:'card ms-card'},
    e('div', {className:'ms-hdr'},
      e('p', {className:'ms-ttl'}, 'Matched Sentences'),
      has
        ? e('span', {className:'ms-cnt'}, matches.length + ' Match' + (matches.length!==1?'es':''))
        : e('span', {style:{padding:'4px 12px',background:'var(--green-d)',border:'1px solid rgba(34,197,94,.25)',borderRadius:99,fontSize:'.75rem',fontWeight:700,color:'var(--green)'}}, 'None found')
    ),
    has
      ? matches.map((m,i) => e(MatchItem, {key:i, match:m, idx:i}))
      : e('div', {style:{textAlign:'center',padding:'40px 20px',color:'var(--tm)'}},
          e('div', {style:{fontSize:'2.5rem',marginBottom:10}}, '✅'),
          e('p', {style:{fontWeight:600,color:'var(--t2)',marginBottom:6}}, 'No direct sentence matches'),
          e('p', {style:{fontSize:'.82rem'}}, 'No sentences exceeded the similarity threshold.')
        )
  );
}

// ─── Input Card ────────────────────────────────────────────────────────
function InputCard({id, label, docNum, value, onChange}){
  const words = wc(value), chars = value.length;
  const ready = value.trim().length >= 20;
  const short = value.trim().length > 0 && !ready;

  const paste = async () => {
    try { onChange(await navigator.clipboard.readText()); } catch(err) {}
  };

  return e('div', {className:'card in-card'},
    e('div', {className:'in-hdr'},
      e('span', {className:'in-lbl'},
        e('span', {className:'doc-b'}, docNum),
        label
      ),
      e('div', {className:'in-acts'},
        e('button', {className:'btn-g', onClick:paste}, IconClipboard(), 'Paste'),
        value && e('button', {className:'btn-g', onClick:()=>onChange('')}, IconX(), 'Clear')
      )
    ),
    e('textarea', {
      id, value, spellCheck:true,
      placeholder:`Paste or type ${label.toLowerCase()} here…\n\nMinimum 20 characters needed.`,
      onChange: ev => onChange(ev.target.value)
    }),
    e('div', {className:'in-meta'},
      e('span', null, '📝 ', words, ' words'),
      e('span', null, '🔤 ', chars, ' chars'),
      short && e('span', {style:{color:'var(--amber)',fontWeight:600}}, 'Need more text'),
      ready && e('span', {style:{color:'var(--green)',fontWeight:600}}, '✓ Ready')
    )
  );
}

// ─── Header ────────────────────────────────────────────────────────────
function Header({onReset}){
  return e('header', {className:'hdr'},
    e('div', {className:'hdr-brand'},
      e('div', {className:'hdr-logo'}, '🧬'),
      e('div', null,
        e('h1', {style:{fontSize:'1.45rem',fontWeight:800,letterSpacing:'-0.5px'}},
          'Plag',
          e('span', {className:'grad'}, 'Check')
        ),
        e('p', {style:{fontSize:'.75rem',color:'var(--tm)',marginTop:1}}, 'Multi-metric plagiarism intelligence')
      )
    ),
    e('div', {style:{display:'flex',alignItems:'center',gap:12}},
      e('span', {className:'hdr-pill'}, 'v2.0'),
      onReset && e('button', {className:'btn-g', onClick:onReset}, IconReset(), 'Reset')
    )
  );
}

// ─── App ───────────────────────────────────────────────────────────────
function App(){
  const [t1, setT1] = useState('');
  const [t2, setT2] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const canRun = t1.trim().length > 20 && t2.trim().length > 20;

  const analyze = async () => {
    if(!canRun){ setError('Please enter at least 20 characters in both panels.'); return; }
    setLoading(true); setError(null); setResult(null);
    try {
      const res = await fetch('/api/check', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text1:t1, text2:t2})
      });
      if(!res.ok){ const d = await res.json(); throw new Error(d.error||'Server error'); }
      setResult(await res.json());
    } catch(err){
      setError(err.message || 'Could not reach the Flask backend. Make sure it is running.');
    } finally {
      setLoading(false);
    }
  };

  const reset = () => { setT1(''); setT2(''); setResult(null); setError(null); };

  const radarData = result
    ? METRICS.map(m => ({metric: m.lb.split(' ')[0], value: result.scores[m.k] ?? 0}))
    : [];

  return e('div', {className:'wrap'},
    e(Header, {onReset: result ? reset : undefined}),

    // Inputs
    e('div', {className:'in-grid'},
      e(InputCard, {id:'t1', label:'Original Document', docNum:'A', value:t1, onChange:setT1}),
      e(InputCard, {id:'t2', label:'Submitted Document', docNum:'B', value:t2, onChange:setT2})
    ),

    // Analyze button
    e('div', {className:'an-row'},
      e('button', {className:'btn', onClick:analyze, disabled:!canRun||loading},
        loading
          ? e(React.Fragment, null,
              e('span', {style:{width:18,height:18,border:'2px solid rgba(255,255,255,0.3)',borderTopColor:'#fff',borderRadius:'50%',display:'inline-block',animation:'spin 0.7s linear infinite'}}),
              'Analyzing…'
            )
          : e(React.Fragment, null, e(IconSearch), 'Analyze for Plagiarism')
      )
    ),

    // Error
    error && e('div', {className:'err fade-in'},
      e('svg', {width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
        e('circle',{cx:12,cy:12,r:10}),e('line',{x1:12,y1:8,x2:12,y2:12}),e('line',{x1:12,y1:16,x2:'12.01',y2:16})
      ),
      error
    ),

    // Spinner
    loading && e('div', {className:'card spin-wrap fade-in', style:{marginBottom:28}},
      e('div', {className:'spinner'}),
      e('p', {style:{color:'var(--t2)',fontSize:'.9rem'}}, 'Running linguistic analysis…'),
      e('p', {style:{fontSize:'.75rem',color:'var(--tm)',textAlign:'center',maxWidth:280}}, 'Computing TF-IDF, Jaccard, n-gram overlaps and sentence-level matching')
    ),

    // Results
    result && !loading && e('div', {className:'results fade-in'},

      // Hero
      e('div', {className:'card hero'},
        e(ScoreRing, {score:result.similarity, verdict:result.verdict}),
        e('div', {className:'hero-info'},
          e('p', {className:'hero-lbl'}, 'Overall Similarity Score'),
          e('p', {className:'hero-val', style:{color:vColor(result.verdict)}}, result.similarity, '%'),
          e(VerdictBadge, {verdict:result.verdict}),
          e('p', {className:'hero-desc'}, vDesc(result.verdict, result.similarity))
        )
      ),

      // Metrics
      e('div', null,
        e('div', {className:'sec-hdr'}, e('span',{className:'sec-ttl'},'Metric Breakdown'), e('div',{className:'sec-line'})),
        e('div', {className:'mtr-grid'},
          ...METRICS.map(m => e(MetricCard, {key:m.k, lb:m.lb, dsc:m.dsc, wt:m.wt, score:result.scores[m.k]??0, c:m.c}))
        )
      ),

      // Charts + Stats
      e('div', {className:'chr-row'},
        e(RadarPanel, {data:radarData}),
        e(DocStats, {stats:result.stats})
      ),

      // Matched Sentences
      e(MatchedSents, {matches:result.matched_sentences})
    ),

    // Empty State
    !result && !loading && !error && e('div', {className:'empty'},
      e('span', {className:'empty-ico'}, '🔍'),
      e('p', {className:'empty-ttl'}, 'Ready to Detect'),
      e('p', {className:'empty-dsc'}, 'Paste two pieces of text above and click ', e('strong',null,'Analyze'), '. We\'ll compare them across five linguistic metrics.')
    )
  );
}

// ─── Mount ─────────────────────────────────────────────────────────────
try {
  ReactDOM.createRoot(document.getElementById('root')).render(e(App));
} catch(mountErr) {
  document.getElementById('root').innerHTML =
    '<div style="color:#ef4444;padding:40px;font-family:sans-serif;background:#080b12;min-height:100vh">' +
    '<h2>⚠ Mount Error</h2><pre style="margin-top:12px;font-size:13px;white-space:pre-wrap">' +
    (mountErr && mountErr.stack ? mountErr.stack : String(mountErr)) + '</pre></div>';
}
</script>
</body>
</html>
